# CI for the TypeScript game in SCS2D/.
#
# The archived Unity project in SpaceCombatSimulation/ is deliberately not
# built or tested here: it is pinned to an editor version that is not installed
# on any runner, running its tests would need a Unity licence, and it is not
# under development. See CLAUDE.md.
#
# Path filters mean tinkering with the Unity tree never queues a run.

name: CI

on:
  push:
    branches: [master]
    paths:
      - 'SCS2D/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'SCS2D/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: SCS2D

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SCS2D/package-lock.json

      - run: npm ci

      # Two projects: sim/ (no ambient types, so host globals are errors there)
      # and the root (tests and scripts, which may use Node).
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # A deliberately sparse matrix: full coverage of the Node axis on Linux,
      # one Windows row for a bit of coverage in the other direction. Matrix
      # rows run in parallel, so extra rows cost concurrency rather than
      # wall-clock, and this is a public repository so runner minutes are free.
      #
      # Why several Node versions: the golden tests pin exact checksums, so
      # passing them on three V8 versions is what actually verifies the
      # hand-written transcendental functions are doing their job. A row that
      # passes on one Node and fails on another means determinism has broken
      # across engine versions — the failure mode that ruled out an engine's
      # built-in physics in DESIGN.md §11.
      #
      # Why Windows, given it is x64 like Linux and so adds little on the
      # determinism axis: development happens on Windows, and the test and
      # tooling code is OS-sensitive (node:path separators in
      # architecture.test.ts, git line-ending conversion). This row catches a
      # break in one direction or the other.
      #
      # Why macOS, and why it is arguably the most valuable single row here:
      # macos-latest is the only GitHub-hosted runner on a different CPU
      # architecture (ARM64, since Apple Silicon). IEEE-754 guarantees that
      # + - * / and sqrt are correctly rounded on any conforming hardware, and
      # the simulation is built from nothing else — so this row is the standing
      # evidence that the arithmetic is genuinely platform-independent rather
      # than merely consistent across x64. Portable replays and async
      # fleet-vs-fleet rest on that, so this row keeps it a verified property
      # instead of an assumed one.
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: SCS2D/package-lock.json

      - run: npm ci

      - run: npm test
